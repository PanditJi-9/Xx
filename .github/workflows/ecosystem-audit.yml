name: Ecosystem audit (measured inventory)

# Runs the measurement tools against the APKs taken from the release, so the inventory
# documents are regenerated by CI instead of by hand. The tools read the binary
# manifest and the DEX string pool directly: no apktool, no device, no secrets.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag holding the APK assets'
        required: true
        default: 're-targets'
      commit_docs:
        description: 'Commit regenerated docs back to the branch'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch APK assets from the release (verified, retried)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p apps-ci
          # One asset at a time with retries: a single aborted transfer used to leave a
          # partial .apk behind and the run reported success. Each file is now verified
          # as a readable zip before it is counted.
          # A draft release has no /releases/tags/<tag> lookup (404), so the list
          # endpoint is used and the tag is matched client-side: this was the reason a
          # run "succeeded" while apps-ci stayed empty.
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .assets[].name" \
            | grep '\.apk$' > /tmp/assets.txt || true
          echo "assets listed: $(wc -l < /tmp/assets.txt)"
          while read -r name; do
            [ -z "$name" ] && continue
            for attempt in 1 2 3; do
              rm -f "apps-ci/$name"
              if gh release download "$TAG" --repo "${{ github.repository }}" \
                   --pattern "$name" --dir apps-ci --clobber; then
                if python3 -c "import sys,zipfile; zipfile.ZipFile(sys.argv[1]).testzip() is None" "apps-ci/$name" 2>/dev/null; then
                  echo "ok: $name"
                  break
                fi
                echo "corrupt zip (attempt $attempt): $name"
              else
                echo "download failed (attempt $attempt): $name"
              fi
              rm -f "apps-ci/$name"
              sleep $((attempt * 5))
            done
          done < /tmp/assets.txt
          echo "verified: $(ls -1 apps-ci/*.apk 2>/dev/null | wc -l)"
          ls -l apps-ci || true

      - name: Coverage against the expected 24
        run: |
          python3 - <<'PY'
          import os, pathlib
          expected = [l.strip() for l in pathlib.Path('docs/audit/EXPECTED_APPS.txt').read_text().splitlines()
                      if l.strip() and not l.startswith('#')]
          got = {p.name for p in pathlib.Path('apps-ci').glob('*.apk')}
          missing = [e for e in expected if e not in got]
          print(f"expected {len(expected)}, present {len(got & set(expected))}, missing {len(missing)}")
          for m in missing:
              print(f"  missing: {m}")
          pathlib.Path('apps-ci/MISSING.txt').write_text("\n".join(missing) + ("\n" if missing else ""))
          # Partial coverage must not overwrite the canonical documents measured on the
          # full corpus. It goes to a separate directory and says so in its own header.
          out = 'docs/audit' if not missing else 'docs/audit/ci-partial'
          print(f"output directory: {out}")
          pathlib.Path('.ci-out').write_text(out + "\n")
          PY

      - name: Self-tests (a tool that passes everything proves nothing)
        run: |
          set -e
          python3 tools/apk_inventory.py --self-test
          python3 tools/apk_xref.py --self-test
          python3 tools/apk_ipc.py --self-test

      - name: Regenerate measured documents (output captured to the repo)
        run: |
          # The run log itself is unreachable from outside while the Actions results
          # service fails, so every command's output is written into the tree: a red run
          # then leaves its own diagnosis in git instead of a blank page.
          out=$(cat .ci-out)
          # exported: each command runs through `bash -c`, and a non-exported variable
          # is invisible there — that produced writes to "/apk-inventory.json.tmp".
          export out
          mkdir -p "$out"
          log=docs/audit/ci-last-run.txt
          : > "$log"
          fail=0
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            echo "== $cmd" >> "$log"
            bash -c "set -o pipefail; $cmd" >> "$log" 2>&1 || { echo "EXIT=$? for: $cmd" >> "$log"; fail=1; }
          done <<'CMDS'
          python3 tools/apk_inventory.py apps-ci/ --json "$out/apk-inventory.json" --markdown "$out/APK_INVENTORY.md"
          python3 tools/apk_xref.py apps-ci/ --json "$out/apk-xref.json" --markdown "$out/APP_DEPENDENCY_GRAPH.md"
          python3 tools/apk_ipc.py apps-ci/ --json "$out/apk-ipc.json" --markdown "$out/IPC_AND_INTEGRATION.md"
          python3 tools/make_component_catalog.py "$out/apk-inventory.json" "$out/COMPONENT_CATALOG.md"
          CMDS
          echo "failed=$fail" >> "$log"
          tail -40 "$log"
          exit "$fail"

      - name: Guard — nothing may be silently empty
        run: |
          out=$(cat .ci-out)
          python3 - "$out" <<'PY'
          import json, sys
          inv = json.load(open(f"{sys.argv[1]}/apk-inventory.json", encoding='utf-8'))
          rows = inv['apks']
          errors = [r for r in rows if 'error' in r]
          no_pkg = [r['file'] for r in rows if not r.get('package')]
          comps = sum(len(r.get('components', {}).get(k, []))
                      for r in rows for k in ('activities', 'services', 'receivers', 'providers'))
          print(f"apks={len(rows)} errors={len(errors)} no-package={len(no_pkg)} components={comps}")
          if errors or no_pkg:
              print("FAIL: unreadable manifests", errors, no_pkg)
              sys.exit(1)
          if comps == 0:
              print("FAIL: a catalog with zero components means the parser broke, not that the apps are empty")
              sys.exit(1)
          PY

      - name: Summary
        run: |
          {
            echo "### Ecosystem audit"
            out=$(cat .ci-out)
            echo "- output: $out"
            echo "- APKs analysed: $(grep -c '^| ' "$out/APK_INVENTORY.md" || true) table rows"
            echo "- components catalogued: $(grep -c '^| \`' "$out/COMPONENT_CATALOG.md" || true)"
            echo "- missing assets: $(wc -l < apps-ci/MISSING.txt 2>/dev/null || echo 0)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ecosystem-audit-docs
          path: |
            docs/audit/APK_INVENTORY.md
            docs/audit/COMPONENT_CATALOG.md
            docs/audit/APP_DEPENDENCY_GRAPH.md
            docs/IPC_AND_INTEGRATION.md
            docs/audit/**/*.md
            docs/audit/**/*.json
            docs/audit/ci-last-run.txt
            apps-ci/MISSING.txt

      - name: Commit regenerated docs (and the run log, even on failure)
        if: ${{ always() && inputs.commit_docs }}
        run: |
          git config user.name 'ecosystem-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/audit docs/IPC_AND_INTEGRATION.md || true
          git diff --cached --quiet && echo "no drift" && exit 0
          git commit -m "docs(audit): regenerate measured inventory in CI (${{ job.status }})"
          git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" || true
          git push
