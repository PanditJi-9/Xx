name: Ecosystem audit (measured inventory)

# Runs the measurement tools against the APKs taken from the release, so the inventory
# documents are regenerated by CI instead of by hand. The tools read the binary
# manifest and the DEX string pool directly: no apktool, no device, no secrets.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag holding the APK assets'
        required: true
        default: 're-targets'
      commit_docs:
        description: 'Commit regenerated docs back to the branch'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch APK assets from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apps-ci
          gh release download "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" --pattern '*.apk' --dir apps-ci --clobber || true
          echo "downloaded: $(ls -1 apps-ci/*.apk 2>/dev/null | wc -l)"
          ls -1 apps-ci || true

      - name: Coverage against the expected 24
        run: |
          python3 - <<'PY'
          import os, pathlib
          expected = [l.strip() for l in pathlib.Path('docs/audit/EXPECTED_APPS.txt').read_text().splitlines()
                      if l.strip() and not l.startswith('#')]
          got = {p.name for p in pathlib.Path('apps-ci').glob('*.apk')}
          missing = [e for e in expected if e not in got]
          print(f"expected {len(expected)}, present {len(got & set(expected))}, missing {len(missing)}")
          for m in missing:
              print(f"  missing: {m}")
          pathlib.Path('apps-ci/MISSING.txt').write_text("\n".join(missing) + ("\n" if missing else ""))
          PY

      - name: Self-tests (a tool that passes everything proves nothing)
        run: |
          set -e
          python3 tools/apk_inventory.py --self-test
          python3 tools/apk_xref.py --self-test
          python3 tools/apk_ipc.py --self-test

      - name: Regenerate measured documents
        run: |
          set -e
          python3 tools/apk_inventory.py apps-ci/ \
            --json docs/audit/apk-inventory.json \
            --markdown docs/audit/APK_INVENTORY.md
          python3 tools/apk_xref.py apps-ci/ \
            --json docs/audit/apk-xref.json \
            --markdown docs/audit/APP_DEPENDENCY_GRAPH.md
          python3 tools/apk_ipc.py apps-ci/ \
            --json docs/audit/apk-ipc.json \
            --markdown docs/IPC_AND_INTEGRATION.md
          python3 tools/make_component_catalog.py \
            docs/audit/apk-inventory.json docs/audit/COMPONENT_CATALOG.md

      - name: Guard — nothing may be silently empty
        run: |
          python3 - <<'PY'
          import json, sys
          inv = json.load(open('docs/audit/apk-inventory.json', encoding='utf-8'))
          rows = inv['apks']
          errors = [r for r in rows if 'error' in r]
          no_pkg = [r['file'] for r in rows if not r.get('package')]
          comps = sum(len(r.get('components', {}).get(k, []))
                      for r in rows for k in ('activities', 'services', 'receivers', 'providers'))
          print(f"apks={len(rows)} errors={len(errors)} no-package={len(no_pkg)} components={comps}")
          if errors or no_pkg:
              print("FAIL: unreadable manifests", errors, no_pkg)
              sys.exit(1)
          if comps == 0:
              print("FAIL: a catalog with zero components means the parser broke, not that the apps are empty")
              sys.exit(1)
          PY

      - name: Summary
        run: |
          {
            echo "### Ecosystem audit"
            echo "- APKs analysed: $(grep -c '^| ' docs/audit/APK_INVENTORY.md || true) table rows"
            echo "- components catalogued: $(grep -c '^| \`' docs/audit/COMPONENT_CATALOG.md || true)"
            echo "- missing assets: $(wc -l < apps-ci/MISSING.txt 2>/dev/null || echo 0)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ecosystem-audit-docs
          path: |
            docs/audit/APK_INVENTORY.md
            docs/audit/COMPONENT_CATALOG.md
            docs/audit/APP_DEPENDENCY_GRAPH.md
            docs/IPC_AND_INTEGRATION.md
            docs/audit/apk-inventory.json
            docs/audit/apk-xref.json
            docs/audit/apk-ipc.json
            apps-ci/MISSING.txt

      - name: Commit regenerated docs
        if: ${{ inputs.commit_docs }}
        run: |
          git config user.name 'ecosystem-audit'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/audit docs/IPC_AND_INTEGRATION.md
          git diff --cached --quiet && echo "no drift" && exit 0
          git commit -m "docs(audit): regenerate measured inventory in CI"
          git push
