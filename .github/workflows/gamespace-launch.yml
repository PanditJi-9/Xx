name: GameSpace launch patch

# Makes the imported Nubia GameSpace launchable on a non-Nubia device.
#
# Measured cause: no component in cn.nubia.gamelauncher declares
# android.intent.category.LAUNCHER — the activities carry intent.action.MAIN
# only (the categories present are DEFAULT and HOME). Installing the APK
# therefore succeeds and produces no icon, which reads as "installed but does
# not open".
#
# The patch is deliberately minimal: one intent-filter on the existing entry
# activity. Nothing else is touched, because anything else would be a guess
# about a device this workflow cannot observe.
#
# The build runs here, never on the owner's phone (AGENTS.md §0.10), and the
# output is a re-signed APK: it cannot be installed over the original, which
# carries the ZTE platform signature.

on:
  workflow_dispatch:
    inputs:
      asset:
        description: Draft-release asset to patch
        required: false
        default: GameSpace.apk
      activity:
        description: Fully qualified entry activity
        required: false
        default: cn.nubia.gamelauncher.activity.GameSpaceActivity
      release_tag:
        description: Draft release holding the APK
        required: false
        default: re-targets
      disable_bitmap_recycle:
        description: Diagnostic — no-op every Bitmap.recycle call (see LEDGER)
        required: false
        type: boolean
        default: false
      bitmap_recycle_only:
        description: Diagnostic — comma-separated path filters (com/bumptech/glide)
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  patch:
    name: patch and sign
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      ASSET: ${{ inputs.asset }}
      ENTRY: ${{ inputs.activity }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the current apktool (the archive one cannot build this APK)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils jq python3 unzip zip >/dev/null
          # Measured: apktool 2.7.0 from the Ubuntu archive decoded fine and
          # then failed to *build* the targetSdk 36 resources. Use the current
          # release jar, which carries its own aapt2.
          url=$(gh api repos/iBotPeaches/Apktool/releases/latest \
            --jq '.assets[] | select(.name | test("^apktool_[0-9.]+[.]jar$")) | .browser_download_url' \
            | head -1)
          test -n "$url"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/apktool.jar" "$url"
          java -jar "$RUNNER_TEMP/apktool.jar" --version

      - name: Fetch the APK from the draft release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work/input"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          cat > "$RUNNER_TEMP/find_asset.py" <<'PY'
          import json, sys

          releases = json.load(open(sys.argv[1], encoding="utf-8"))
          tag, name = sys.argv[2], sys.argv[3]
          for release in releases:
              if release.get("tag_name") != tag:
                  continue
              for asset in release.get("assets", []):
                  if asset.get("name") == name:
                      print(asset["id"])
                      raise SystemExit(0)
          raise SystemExit(f"asset {name!r} not found in draft release {tag!r}")
          PY
          asset_id=$(python3 "$RUNNER_TEMP/find_asset.py" "$RUNNER_TEMP/releases.json" "$RELEASE_TAG" "$ASSET")
          gh api -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
            > "$RUNNER_TEMP/work/input/$ASSET"
          ls -l "$RUNNER_TEMP/work/input/$ASSET"

      - name: Decode, patch the entry activity, rebuild
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/work"
          apktool() { java -jar "$RUNNER_TEMP/apktool.jar" "$@"; }

          if ! apktool d --force --output "$work/decoded" "$work/input/$ASSET" \
              > "$work/apktool-d.log" 2>&1; then
            echo "::error::apktool decode failed"
            tail -40 "$work/apktool-d.log"
            exit 1
          fi

          python3 tools/re_patch_launcher.py \
            --manifest "$work/decoded/AndroidManifest.xml" \
            --activity "$ENTRY"

          # Measured on the device: the app dies before any window appears with
          #   SecurityException: must have one of: [WRITE_SECURE_SETTINGS]
          #   at CommonUtil.notifyHandheldModeChanged <- CommonApplication.onCreate
          # A repacked app can never hold that permission, so the method that
          # needs it is neutralized instead of crashing the whole process.
          python3 tools/re_patch_smali.py --decoded "$work/decoded" \
            --class cn.nubia.common.util.CommonUtil \
            --method notifyHandheldModeChanged --mode noop

          # The same exception then came from GameLauncherApplication.doConfig.
          # Rather than chase one method per build, contain every void method in
          # the tree that performs such a write: behaviour is identical wherever
          # the write is permitted, and contained where it is not.
          python3 tools/re_patch_smali.py --decoded "$work/decoded" --sweep

          # The panel's trigger has no sender on this ROM: counting the action
          # string across every dex gives GameFloat=1 and GameSpace=1, both as
          # receivers, and zero elsewhere. RedMagic's system framework sends it.
          # So the launcher sends it itself on the one path it uses to start a
          # game — a foreground sender, which is what Android requires before it
          # will start another app's process from a broadcast.
          python3 tools/re_inject_broadcast.py --self-test
          # One injection, on the chokepoint: the two-argument overload is a
          # four-instruction delegate to the three-argument one (measured in
          # smali/cn/nubia/gamelauncher/helper/CardHelper.smali:966-975), so
          # patching both sent the broadcast twice for the same click. Patching
          # the delegate target covers every caller with one send.
          python3 tools/re_inject_broadcast.py --decoded "$work/decoded" \
            --class cn.nubia.gamelauncher.helper.CardHelper \
            --method startApp \
            --signature '(Lcn/nubia/gamelauncher/bean/AppListItemBean;ZLjava/lang/Runnable;)V' \
            --context-field mContext --bean-getter getPackageName \
            --action cn.zte.gamefloat.powerpanel.action.FOREGROUND_GAME_CHANGE \
            --extra packageName \
            --component cn.zte.gamefloat/cn.zte.gamefloat.receiver.GameForegroundChangeReceiver

          # Diagnostic switch, off by default. Recycling a bitmap that a live
          # ImageView still draws is the measured cause of the start-button
          # crash (logcat -b crash, 2026-11-19 03:31: Canvas: trying to use a
          # recycled bitmap <- BitmapDrawable.draw <- ImageView.onDraw). One
          # build with every recycle skipped answers whether that is the crash
          # we meet, instead of guessing; it trades a leak for a crash.
          if [ "${{ inputs.disable_bitmap_recycle }}" = "true" ]; then
            python3 tools/re_disable_bitmap_recycle.py --self-test
            # One prefix per build narrows the cause once the broad build has
            # proven that skipping recycles removes the crash.
            only=()
            IFS=',' read -ra filters <<< "${{ inputs.bitmap_recycle_only }}"
            for token in "${filters[@]}"; do
              [ -n "$token" ] && only+=(--only "$token")
            done
            python3 tools/re_disable_bitmap_recycle.py --decoded "$work/decoded" "${only[@]+"${only[@]}"}"
          fi

          # apktool 3.x dropped --use-aapt2: aapt2 is the only engine there, so
          # passing the flag printed the usage text and exited 1.
          if ! apktool b --output "$work/unsigned.apk" "$work/decoded" \
              > "$work/apktool-b.log" 2>&1; then
            echo "::error::apktool build failed"
            tail -60 "$work/apktool-b.log"
            exit 1
          fi
          ls -l "$work/unsigned.apk"

          # Diagnose which methods actually launch a game on this build's tree,
          # so the next iteration can target the real chokepoint instead of
          # guessing. Result is uploaded as launch-paths.txt.
          python3 tools/re_diagnose_launch.py --decoded "$work/decoded" \
            > "$work/launch-paths.txt" 2>&1 || true
          echo "--- launch paths (head) ---"
          head -60 "$work/launch-paths.txt"

          # Prove the sender where it is written. Counting the trigger string in
          # the dex cannot do it: a dex string table keeps each literal once per
          # file, so a correct patch still printed "2" and a gate of 3 could
          # never pass (measured on run 44452353311, which was green in the
          # source and red only at this assertion).
          senders=$(grep -c 'sendBroadcast' \
            "$work/decoded/smali/cn/nubia/gamelauncher/helper/CardHelper.smali" || true)
          echo "injected sendBroadcast calls in CardHelper: $senders"
          test "$senders" -eq 1
          carriers=$(for dex in $(unzip -Z1 "$work/unsigned.apk" 'classes*.dex'); do
            unzip -p "$work/unsigned.apk" "$dex" | grep -a -q 'powerpanel.action.FOREGROUND_GAME_CHANGE' && echo "$dex"
          done | wc -l)
          echo "dex files carrying the trigger string: $carriers"
          test "$carriers" -eq 2

      - name: Record the device gates the app checks
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/work"
          # Evidence for the next iteration instead of a guess: show where the
          # decompiled tree consults RedMagic identity, so a gate can be read
          # before anything is patched.
          : > "$work/gating.txt"
          for token in isRedMagicDevice isRedMagic ZTE_FEATURE_RED_MAGIC; do
            echo "### $token" >> "$work/gating.txt"
            files=$(grep -rl --include='*.smali' -F "$token" "$work/decoded" 2>/dev/null | head -3 || true)
            echo "$files" >> "$work/gating.txt"
            for file in $files; do
              echo "--- $file" >> "$work/gating.txt"
              grep -n -A14 -B2 -F "$token" "$file" | head -40 >> "$work/gating.txt" || true
            done
          done
          python3 tools/re_patch_smali.py --decoded "$work/decoded" --scan-putstring --limit 30 \
            >> "$work/gating.txt" 2>&1 || true
          wc -l "$work/gating.txt"

      - name: Restore the stable patch signing key
        uses: actions/cache@v4
        with:
          path: .patch-signing
          key: nubia-patch-signing-v1

      - name: Sign for installation (v1+v2+v3)
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/work"
          url=$(gh api repos/patrickfav/uber-apk-signer/releases/latest \
            --jq '.assets[] | select(.name | test("^uber-apk-signer-[0-9.]+[.]jar$")) | .browser_download_url' \
            | head -1)
          test -n "$url"
          curl -fsSL --retry 3 -o "$work/uber-apk-signer.jar" "$url"
          keydir="$GITHUB_WORKSPACE/.patch-signing"
          mkdir -p "$keydir"
          ks="$keydir/patch.jks"
          if [ ! -f "$ks" ]; then
            keytool -genkeypair -keystore "$ks" -storepass patchsigning -keypass patchsigning \
              -alias patch -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Nubia Patch, O=MaxManager, C=EG" >/dev/null
          fi
          java -jar "$work/uber-apk-signer.jar" \
            --apks "$work/unsigned.apk" --out "$work/signed" --allowResign \
            --ks "$ks" --ksAlias patch --ksPass patchsigning --ksKeyPass patchsigning
          ls -l "$work/signed"
          cp "$work/signed/"*.apk "$work/GameSpace-launcher.apk"

      - name: Verify the patched manifest and signature in the built APK
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/work"
          # apktool is a jar now, not a PATH binary: the shell function defined
          # in the build step does not survive into this one (exit 127).
          if ! java -jar "$RUNNER_TEMP/apktool.jar" d --force --no-src \
              --output "$work/verify" "$work/GameSpace-launcher.apk" \
              > "$work/apktool-verify.log" 2>&1; then
            echo "::error::could not re-decode the built APK"
            tail -30 "$work/apktool-verify.log"
            exit 1
          fi
          echo "--- LAUNCHER entries in the rebuilt manifest ---"
          count=$(grep -c "android.intent.category.LAUNCHER" "$work/verify/AndroidManifest.xml" || true)
          grep -n -B4 -A2 "android.intent.category.LAUNCHER" "$work/verify/AndroidManifest.xml" || true
          test "$count" -ge 1
          echo "--- signature ---"
          python3 tools/re_apk_signature.py "$work/GameSpace-launcher.apk" \
            --text "$work/signature.txt" | tee "$work/signature.txt" | head -20
          sha256sum "$work/GameSpace-launcher.apk" | tee "$work/patch-sha256.txt"

      - name: Pack the result for transfer (the APK itself stays out of the artifact)
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/work"
          cd "$work"
          apk_bytes=$(stat -c %s GameSpace-launcher.apk)
          7z a -t7z -mx=9 -m0=lzma2 -ms=on -mmt="$(nproc)" \
            GameSpace-launcher.7z GameSpace-launcher.apk > 7z.log 2>&1 || { tail -20 7z.log; exit 1; }
          pkg_bytes=$(stat -c %s GameSpace-launcher.7z)
          python3 -c "
          apk = $apk_bytes
          pkg = $pkg_bytes
          print(f'apk   {apk:,} bytes')
          print(f'7z    {pkg:,} bytes  ({100 * pkg / apk:.1f}% of the apk)')
          "
          sha256sum GameSpace-launcher.7z | tee patch-7z-sha256.txt

      - name: Upload the patched APK
        uses: actions/upload-artifact@v7
        with:
          name: GameSpace-launcher-patched
          path: |
            ${{ runner.temp }}/work/GameSpace-launcher.7z
            ${{ runner.temp }}/work/patch-7z-sha256.txt
            ${{ runner.temp }}/work/patch-sha256.txt
            ${{ runner.temp }}/work/signature.txt
            ${{ runner.temp }}/work/apktool-b.log
            ${{ runner.temp }}/work/gating.txt
            ${{ runner.temp }}/work/launch-paths.txt
          if-no-files-found: error
          retention-days: 30
