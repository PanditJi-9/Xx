name: GameAssist stub patch

# Gives cn.nubia.gameassist the one class its firmware supplies and this device
# never had, so the package can start at all.
#
# Measured on the device (adb logcat -b crash, 2026-11-18):
#
#   NoClassDefFoundError: Failed resolution of:
#       Lcom/zte/gameassist/GameAssistWrapper$Callback;
#     at cn.nubia.gameassist.utils.Utils.<clinit>
#     at cn.nubia.gameassist.GameAssistApplication.onCreate
#
# Utils holds a field of type GameAssistControllerWrapper$Callback, whose own
# field is typed GameAssistWrapper$Callback. Resolving that missing type kills
# Application.onCreate, so none of the package's services can run — including
# ProjectionPanelService, the overlay the game session is supposed to show.
#
# The stub is `return null / false / empty`, i.e. the same answer the callers
# already handle, so remote-controller features stay off instead of crashing.
# Nothing else in the manifest is touched.

on:
  workflow_dispatch:
    inputs:
      asset:
        description: Draft-release asset to patch
        required: false
        default: GameAssist.apk
      release_tag:
        description: Draft release holding the APK
        required: false
        default: re-targets

permissions:
  contents: write

jobs:
  patch:
    name: patch and sign
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      ASSET: ${{ inputs.asset }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the current apktool
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils >/dev/null
          url=$(gh api repos/iBotPeaches/Apktool/releases/latest \
            --jq '.assets[] | select(.name | test("^apktool_[0-9.]+[.]jar$")) | .browser_download_url' \
            | head -1)
          test -n "$url"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/apktool.jar" "$url"
          java -jar "$RUNNER_TEMP/apktool.jar" --version

      - name: Fetch the APK from the draft release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work/input"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          cat > "$RUNNER_TEMP/find_asset.py" <<'PY'
          import json, sys

          releases = json.load(open(sys.argv[1], encoding="utf-8"))
          tag, name = sys.argv[2], sys.argv[3]
          for release in releases:
              if release.get("tag_name") != tag:
                  continue
              for asset in release.get("assets", []):
                  if asset.get("name") == name:
                      print(asset["id"])
                      raise SystemExit(0)
          raise SystemExit(f"asset {name!r} not found in draft release {tag!r}")
          PY
          asset_id=$(python3 "$RUNNER_TEMP/find_asset.py" "$RUNNER_TEMP/releases.json" "$RELEASE_TAG" "$ASSET")
          gh api -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
            > "$RUNNER_TEMP/work/input/$ASSET"
          ls -l "$RUNNER_TEMP/work/input/$ASSET"

      - name: Decode, add the stub, rebuild
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/work"
          # This patch touches no resource and no manifest entry: only three
          # classes are added. Decoding resources is therefore not just
          # unnecessary, it is actively harmful here — measured:
          #   res/layout/input_method_switch_item.xml:8:
          #     error: resource android:id/progress_percent is private.
          #     error: failed linking file resources.
          # so the build never reaches the dex. --no-res plus --copy-original
          # keeps the original resources.arsc and manifest byte for byte.
          if ! java -jar "$RUNNER_TEMP/apktool.jar" d --force --no-res \
              --output "$work/decoded" "$work/input/$ASSET" > "$work/apktool-d.log" 2>&1; then
            echo "::error::apktool decode failed"
            tail -40 "$work/apktool-d.log"
            exit 1
          fi

          # classes2.dex is where cn.nubia.gameassist keeps com.zte.* code.
          test -d "$work/decoded/smali_classes2"
          cp -r tools/re_stubs/gameassist/com "$work/decoded/smali_classes2/"
          find "$work/decoded/smali_classes2/com/zte/gameassist" -name '*.smali' -print

          # Next crash after the class wall, measured on the device:
          #   NullPointerException: attempting to read field
          #     'java.util.List GameCheck$GameLauncherObserver.c' on a null object
          #     at GameCheck$GameLauncherObserver.c <- GameCheck.d <- SystemMgr.t
          # The static GameCheck.c observer is null because nothing on this ROM
          # registers it, so the bridge getter dereferences null. Answer with an
          # empty list: the caller iterates it and finds no game, which is the
          # truth here. (Refused without --allow-non-void for any other method.)
          python3 tools/re_patch_smali.py --decoded "$work/decoded" \
            --class 'com.zte.gameassist.common.GameCheck$GameLauncherObserver' \
            --method c --mode stub --return empty-list --allow-non-void

          # Next measured crash: the wrapper calls a hidden framework method
          #   NoSuchMethodError: No virtual method
          #     setNotificationListenerAccessGranted(ComponentName,Z)V
          #     in class Landroid/app/NotificationManager;
          # It exists on the vendor image and was removed/hidden here, so the
          # call must degrade rather than abort: keep the body, contain the Error.
          python3 tools/re_patch_smali.py --decoded "$work/decoded" \
            --class com.zte.shared.wrapper.NotificationManagerWrapper \
            --method setNotificationListenerAccessGranted --mode wrap --catch nosuchmethod

          # Last measured wall: the window-manager init reaches
          #   NullPointerException: invoke interface IModuleProxy
          #     cn.nubia.componentcenter.service.GameAssistComService.a(Class)
          #     on a null object reference
          # i.e. a vendor ComponentCenter service this ROM does not have. No
          # repack provides that service, so onCreate is contained: the process
          # lives, and whatever still does not work is then measured in logcat
          # instead of being assumed either way.
          python3 tools/re_patch_smali.py --decoded "$work/decoded" \
            --class cn.nubia.gameassist.GameAssistApplication \
            --method onCreate --mode wrap --catch throwable

          # onCreate now completes, and the same vendor-service NPE comes back
          # from a posted runnable instead:
          #   ThemeController.a.run -> ThemeController.d -> GameAssistWindowManager
          #     -> VolumeSeekbarViewController.<init> -> GameAssistComService.a
          # Containing it keeps the process alive long enough to observe whether
          # any window is ever created; if none is, that is the measurement.
          python3 tools/re_patch_smali.py --decoded "$work/decoded" \
            --class cn.nubia.gameassist.theme.a \
            --method run --mode wrap --catch throwable

          # The same WRITE_SECURE_SETTINGS class of crash that killed GameSpace
          # applies here; contain it now rather than one build per crash.
          python3 tools/re_patch_smali.py --decoded "$work/decoded" --sweep

          # The panel is built by GameAssist itself, but only after its own
          # onGameStart() — the signal RedMagic's system sends and this ROM never
          # does. A stub re-raises the same call shortly after startup instead of
          # waiting for a sender that does not exist here.
          # Measured 2026-11-19 11:47: GameAssistWindowManager.<init> -> V()
          # dies in VolumeSeekbarViewController.<init> because it asks
          # Router.getService("GameAssistComService") and no component registers
          # it here. V() already declares .catch Ljava/lang/Exception; and
          # rethrows as RuntimeException, so it cannot be wrapped — the fix is
          # the stub that TriggerPanel$1 registers before constructing (below).

          # The panel's own show path is gated on SystemMgr.isGameScene(), which
          # reads a flag only the RedMagic framework sets. Our trigger *is* the
          # game-start signal on this ROM, so the scene it emulates is declared
          # here (70 call sites; measured body: sget-boolean G, return).
          python3 tools/re_patch_smali.py --decoded "$work/decoded" \
            --class com.zte.gameassist.common.SystemMgr \
            --method isGameScene --mode stub --return true --allow-non-void

          # The panel window is created with type 2027 (a system window) and
          # with the ZTE PRIVATE_FLAG_TRUSTED_OVERLAY helper — the same pair that
          # made GameFloat's addView fail with a false INTERNAL_SYSTEM_WINDOW
          # denial. Both are replaced by the public overlay route: type 2038
          # (TYPE_APPLICATION_OVERLAY, allowed with SYSTEM_ALERT_WINDOW) and no
          # trusted-overlay flag.
          python3 tools/re_force_window_type.py --decoded "$work/decoded" \
            --class cn.nubia.gameassist.panel.GameAssistWindowManager \
            --method Z --field s --value 2038

          python3 tools/re_strip_invoke.py --decoded "$work/decoded" \
            --needle addHidePrivateTrustedOverlayFlags

          # Measured on the device 2026-11-19 12:11 (build 44502479730): the
          # trigger now runs the whole show sequence, and the process dies inside
          # W() -> SettingsListener.<init> -> GameDurationManager -> TopActivityMonitor.a
          # -> GAControllerProxy.b, which calls IActivityManager$Stub.asInterface —
          # a hidden API Android 16 removed:
          #   NoSuchMethodError: No static method asInterface(Landroid/os/IBinder;)
          #     Landroid/app/IActivityManager; in class ...IActivityManager$Stub
          # Containing that single static registration call lets W() finish, so
          # Z() builds the params and c0() sets the D gate the show path reads.
          python3 tools/re_patch_smali.py --decoded "$work/decoded" \
            --class com.zte.gameassist.ext.system.TopActivityMonitor \
            --method a --mode wrap --catch throwable

          # Measured on the device 2026-11-19 12:19 (build 44503810514): the same
          # removed hidden API is reached from a second branch —
          #   GameAssistMutex.<init> -> RemoteList.<init> -> getBaseValue
          #     -> GAControllerProxy.d -> b() -> IActivityManager$Stub.asInterface
          # so containing each caller is an endless chase. b() exists only to find
          # ZTE's extended ActivityManager (getGameAssist*), which this ROM does
          # not have; it now returns null. getBaseValue already catches
          # Ljava/lang/Exception and answers an empty list — the earlier death was
          # an Error (NoSuchMethodError), which that catch cannot hold, but the
          # NullPointerException from a null controller is caught as intended.
          python3 tools/re_patch_smali.py --decoded "$work/decoded" \
            --class com.zte.gameassist.ext.common.GAControllerProxy \
            --method b --mode stub --return null --allow-non-void

          # Measured on the device 2026-11-19 12:27 (build 44505341579): with b()
          # stubbed, W() got past GameAssistMutex.<init>'s RemoteList and died one
          # frame later —
          #   NullPointerException: Collection.toArray() on a null object reference
          #     at ArrayList.addAll(there is no remote list on this ROM)
          #     at GameAssistMutex.f <- cn.nubia.gameassist.utils.a.a
          #     <- MutableData.d <- GameAssistMutex.<init> <- W
          # The observer is where a missing remote value must be ignored; f() keeps
          # its monitor and catchall untouched.
          python3 tools/re_patch_smali.py --decoded "$work/decoded" \
            --class cn.nubia.gameassist.utils.a \
            --method a --mode wrap --catch runtime

          # Measured on the device 2026-11-19 12:46 (build 44506598906): W()
          # completed and the root view inflated (res/A4S.xml), then the process
          # died on the main thread in the first touch dispatch:
          #   NoSuchMethodError: No virtual method updateDisplay(I)V in class
          #     Landroid/content/Context;
          #     at com.zte.shared.wrapper.ContextWrapper.updateDisplay
          #     at com.zte.gameassist.input.EventDispatcher.g
          #     at GameAssistWindowManager$4.run
          # Context.updateDisplay(int) is a ZTE framework extension Android 16 does
          # not have. Both wrappers only forward to it, so their bodies become
          # return-void — no caller can reach the missing method any more.
          python3 tools/re_patch_smali.py --decoded "$work/decoded" \
            --class com.zte.shared.wrapper.ContextWrapper \
            --method updateDisplay --signature '(Landroid/content/Context;)V' --mode noop

          python3 tools/re_patch_smali.py --decoded "$work/decoded" \
            --class com.zte.shared.wrapper.ContextWrapper \
            --method updateDisplay --signature '(Landroid/content/Context;I)V' --mode noop

          # Measured on the device 2026-11-19 12:57 (build 44510017758): W() now
          # completes and GameAssistRootView inflates res/A4S.xml, then the main
          # thread dies in EventDispatcher.g -> InputManagerWrapper.initGestureInputMonitor
          # on Context.getDisplayId(), another ZTE framework method Android 16 removed:
          #   NoSuchMethodError: No virtual method getDisplayId()I in class Landroid/content/Context;
          # The gesture monitor also needs the signature MONITOR_INPUT permission this app
          # does not hold, so it could never work here; the panel does not need it.
          # g() only stores the result in field d and logs, so null is safe.
          python3 tools/re_patch_smali.py --decoded "$work/decoded" \
            --class com.zte.shared.wrapper.InputManagerWrapper \
            --method initGestureInputMonitor --mode stub --return null --allow-non-void
          # Measured on the device 2026-11-19 13:04 (build 44510841360): the retry
          # reached showWindow(reason=retryTrigger) with D=true, then a0() died in
          #   BrightSeekbarViewController.p -> IAppBrightnessProxy.getMax()
          # because componentcenter exposes no brightness proxy on this ROM.
          # BaseViewController.o(View) is the single funnel that calls every
          # controller's p(View); containing it (and P(), its teardown twin) keeps
          # one missing proxy from aborting the whole panel build. Both are void
          # and declare no .catch, so wrap is allowed.
          python3 tools/re_patch_smali.py --decoded "$work/decoded" \
            --class cn.nubia.gameassist.common.BaseViewController \
            --method o --mode wrap --catch throwable

          python3 tools/re_patch_smali.py --decoded "$work/decoded" \
            --class cn.nubia.gameassist.common.BaseViewController \
            --method P --mode wrap --catch throwable

          # Measured 2026-11-19 13:36 (build 44514544934): the panel window was
          # already added (windows=2, screenshot saved) and then the process died
          # on the DatabaseThread from a tile callback:
          #   NoClassDefFoundError Lcom/zte/feature/Feature; (DisplayManagerWrapper
          #   <clinit>) ← ActivityManagerWrapper.e ← RecordTile.w ← ObserverManager.b
          #   ← RecordTile.c ← TileHost.w ← GameAssistWindowManager.n0 ← v ← t.run
          # TileHost.w is the single funnel; it already declares one .catch, so the
          # wrap goes on its two thin callers instead (j0 and n0) — every tile
          # failure on that thread is then contained and the panel keeps running.
          python3 tools/re_patch_smali.py --decoded "$work/decoded" \
            --class cn.nubia.gameassist.panel.GameAssistWindowManager \
            --method j0 --mode wrap --catch throwable

          python3 tools/re_patch_smali.py --decoded "$work/decoded" \
            --class cn.nubia.gameassist.panel.GameAssistWindowManager \
            --method n0 --mode wrap --catch throwable

          # NPE مسمّى يقتل العملية (قِيس 11-19 17:29:25 على PID 14712):
          #   am_crash java.lang.NullPointerException: Attempt to invoke virtual
          #   method 'int[] …GameAssistWindowManager.U()' on a null object reference
          #   ← am_proc_died بعد 0.1s (adj 200).
          # U() نفسها سليمة (sget Q/P + filled-new-array + return-object)؛ الفشل على
          # المستقبِل: GameAssistApplication.j() يعيد null ثم يُنادى U() بلا فحص.
          # والمستدعون الثلاثة فقط هم أدناه، فتُلفّ حاوياتهم لا U() (ADR-18: نقطة واحدة
          # لكل مسار، ولا صنف بديل قبل قياس الحاجة إليه).
          python3 tools/re_patch_smali.py --decoded "$work/decoded" \
            --class cn.nubia.gameassist.plugin.tiles.FloatButtonQSTile \
            --method T1 --signature '()V' --mode wrap --catch throwable

          python3 tools/re_patch_smali.py --decoded "$work/decoded" \
            --class cn.nubia.gameassist.meditationmode.danmu.BarrageTouchHelper \
            --method b --signature '(Landroid/view/MotionEvent;)V' \
            --mode wrap --catch throwable

          python3 tools/re_patch_smali.py --decoded "$work/decoded" \
            --class cn.nubia.gameassist.tips.learn.UserGuideController \
            --method q \
            --signature '(Ljava/lang/String;Lcn/nubia/gameassist/tips/learn/UserGuideView$UserGuideResource;)V' \
            --mode wrap --catch throwable

          # نوع النافذة 2003 (TYPE_SYSTEM_ALERT) يقتل العملية حتمًا:
          # قِيس (11-19 17:42:52 على PID 25889، بعد أن كانت اللوحة والشريط حيّين):
          #   am_crash android.view.WindowManager$BadTokenException:
          #     Unable to add window … permission denied for window type 2003
          #   ← am_proc_died [0,25889,cn.nubia.gameassist,905,19]
          # و2003 يتطلّب INTERNAL_SYSTEM_WINDOW الذي لا يُمنح لتطبيق مُعاد التوقيع على
          # Android 16؛ فالمكافئ العام هو 2038 الذي تستعمله اللوحة والشريط بالفعل.
          # المواضع المقيسة أربعة فقط في الشجرة كلها (grep 0x7d3 ⇒ 4)، ثلاثة منها
          # تبني LayoutParams عبر <init>(III) والرابع بـiput type:I — ولهذا لا تراها
          # re_force_window_type.py (تطلب iput-object لحقل LayoutParams).
          python3 tools/re_force_type_literal.py --self-test
          python3 tools/re_force_type_literal.py --decoded "$work/decoded" \
            --path smali/cn/nubia/plugin/gameshader/ShaderSettingWindow.smali \
            --needle 0x7d3 --value 0x7f6 --expect 1
          python3 tools/re_force_type_literal.py --decoded "$work/decoded" \
            --path smali/cn/nubia/plugin/superresolution/SuperResolutionSettingWindowManager.smali \
            --needle 0x7d3 --value 0x7f6 --expect 1
          python3 tools/re_force_type_literal.py --decoded "$work/decoded" \
            --path smali/cn/nubia/plugin/timer/TimerWindow.smali \
            --needle 0x7d3 --value 0x7f6 --expect 1
          python3 tools/re_force_type_literal.py --decoded "$work/decoded" \
            --path smali_classes2/com/zte/gameassist/common/ActivityWindow.smali \
            --needle 0x7d3 --value 0x7f6 --expect 1
          # بوابة: لا يبقى حرفيٌّ 0x7d3 في أي ملف — بناءٌ يمرّ هنا يضمن أن النوع
          # الخطير لم يُعَد بأي مسار آخر.
          leftover=$(grep -rn '0x7d3' "$work/decoded/smali" "$work/decoded/smali_classes2" | wc -l)
          echo "leftover 0x7d3 windows: $leftover"
          test "$leftover" -eq 0

          python3 tools/re_inject_call.py --self-test

          mkdir -p "$work/decoded/smali_classes2/cn/nubia/gameassist"
          cp tools/re_stubs/gameassist/cn/nubia/gameassist/TriggerPanel*.smali \
             tools/re_stubs/gameassist/cn/nubia/gameassist/GameAssistComStub*.smali \
             tools/re_stubs/gameassist/cn/nubia/gameassist/GameAssistHandle*.smali \
             "$work/decoded/smali_classes2/cn/nubia/gameassist/"

          # الصنف الغائب com.zte.feature.Feature: قِيس (11-19 16:37:02.445) أن
          # NoClassDefFoundError عليه داخل DisplayManagerWrapper.<clinit> يقتل
          # العملية كاملة على مسار RecordTile ← DessertTilesAdapter ← RecyclerView.
          # فيُحقن بديل واحد في الجذر بدل لفّ كل مُستدعٍ.
          mkdir -p "$work/decoded/smali_classes2/com/zte/feature"
          cp tools/re_stubs/gameassist/com/zte/feature/Feature.smali \
             "$work/decoded/smali_classes2/com/zte/feature/"

          python3 tools/re_inject_call.py --decoded "$work/decoded" \
            --class cn.nubia.gameassist.GameAssistApplication \
            --method onCreate --signature '()V' \
            --target 'Lcn/nubia/gameassist/TriggerPanel;->arm()V'

          # الشريط يُبنى من المستقبل نفسه لا من TriggerPanel$1: قِيس مرتين
          # (15:26 و15:54) أن السطر المحقون في TriggerPanel$1 لا يُنتج أي سجل
          # من GameAssistHandle، والمستقبل يعمل في كل بثّ بلا استثناء.
          python3 tools/re_inject_call.py --decoded "$work/decoded" \
            --class cn.nubia.gameassist.plugin.config.UpdatePluginConfigReceiver \
            --method onReceive \
            --signature '(Landroid/content/Context;Landroid/content/Intent;)V' \
            --target 'Lcn/nubia/gameassist/GameAssistHandle;->boot()V'

          if ! java -jar "$RUNNER_TEMP/apktool.jar" b --copy-original \
              --output "$work/unsigned.apk" "$work/decoded" > "$work/apktool-b.log" 2>&1; then
            echo "::error::apktool build failed"
            tail -60 "$work/apktool-b.log"
            exit 1
          fi
          ls -l "$work/unsigned.apk"

      - name: Restore the stable patch signing key
        uses: actions/cache@v4
        with:
          path: .patch-signing
          key: nubia-patch-signing-v1

      - name: Sign for installation (v1+v2+v3)
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/work"
          url=$(gh api repos/patrickfav/uber-apk-signer/releases/latest \
            --jq '.assets[] | select(.name | test("^uber-apk-signer-[0-9.]+[.]jar$")) | .browser_download_url' \
            | head -1)
          test -n "$url"
          curl -fsSL --retry 3 -o "$work/uber-apk-signer.jar" "$url"
          keydir="$GITHUB_WORKSPACE/.patch-signing"
          mkdir -p "$keydir"
          ks="$keydir/patch.jks"
          if [ ! -f "$ks" ]; then
            keytool -genkeypair -keystore "$ks" -storepass patchsigning -keypass patchsigning \
              -alias patch -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Nubia Patch, O=MaxManager, C=EG" >/dev/null
          fi
          java -jar "$work/uber-apk-signer.jar" \
            --apks "$work/unsigned.apk" --out "$work/signed" --allowResign \
            --ks "$ks" --ksAlias patch --ksPass patchsigning --ksKeyPass patchsigning
          cp "$work/signed/"*.apk "$work/GameAssist-stub.apk"
          ls -l "$work/GameAssist-stub.apk"

      - name: Verify the stub is defined and the APK is signed
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/work"
          # A descriptor string in the dex is not a class definition — that is
          # precisely the state that crashed the app. Require class_defs.
          python3 tools/re_dex_classes.py "$work/GameAssist-stub.apk" \
            --require 'Lcom/zte/gameassist/GameAssistWrapper;' \
            --require 'Lcom/zte/gameassist/GameAssistWrapper$Callback;' \
            --require 'Lcom/zte/gameassist/GameAssistWrapper$MutexCallback;'

          # A dex-only patch must leave the resource table and the manifest
          # untouched. Prove it instead of assuming --copy-original worked.
          for part in resources.arsc AndroidManifest.xml; do
            before=$(unzip -p "$work/input/$ASSET" "$part" | sha256sum | cut -d' ' -f1)
            after=$(unzip -p "$work/GameAssist-stub.apk" "$part" | sha256sum | cut -d' ' -f1)
            echo "$part original=$before built=$after"
            test "$before" = "$after"
          done
          python3 tools/re_apk_signature.py "$work/GameAssist-stub.apk" \
            --text "$work/signature.txt" | tee "$work/signature.txt" | head -12
          sha256sum "$work/GameAssist-stub.apk" | tee "$work/patch-sha256.txt"

      - name: Pack the result for transfer
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/work"
          cd "$work"
          apk_bytes=$(stat -c %s GameAssist-stub.apk)
          7z a -t7z -mx=9 -m0=lzma2 -ms=on -mmt="$(nproc)" \
            GameAssist-stub.7z GameAssist-stub.apk > 7z.log 2>&1 || { tail -20 7z.log; exit 1; }
          pkg_bytes=$(stat -c %s GameAssist-stub.7z)
          python3 -c "
          apk = $apk_bytes
          pkg = $pkg_bytes
          print(f'apk   {apk:,} bytes')
          print(f'7z    {pkg:,} bytes  ({100 * pkg / apk:.1f}% of the apk)')
          "
          sha256sum GameAssist-stub.7z | tee patch-7z-sha256.txt

      - uses: actions/upload-artifact@v6
        with:
          name: gameassist-stub
          path: |
            ${{ runner.temp }}/work/GameAssist-stub.7z
            ${{ runner.temp }}/work/patch-7z-sha256.txt
            ${{ runner.temp }}/work/patch-sha256.txt
            ${{ runner.temp }}/work/signature.txt
            ${{ runner.temp }}/work/apktool-b.log
          if-no-files-found: error
