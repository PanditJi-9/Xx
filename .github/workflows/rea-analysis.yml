name: REA analysis

# REA (github.com/morluto/rea) is the designated engine for "how does this behaviour
# work" questions. It cannot run on the local Node (22.22.1 < required 22.23.4), so it
# runs here on Node 24. This job establishes the channel and records the real CLI
# surface; wiring a concrete APK command happens only after that output is read,
# not from a guessed flag.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag holding the APK assets'
        required: true
        default: 're-targets'
      target_apk:
        description: 'APK file name to stage for analysis'
        required: true
        default: 'GameAssist.apk'

permissions:
  contents: write

jobs:
  rea:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Record the runtime REA will see
        run: |
          node -v
          npm -v
          java -version 2>&1 | head -2
          which jadx || echo "jadx: absent on runner"

      - name: Install REA
        run: |
          npm install --global rea-agents@latest
          rea --version | tee rea-version.txt

      - name: Capture the real CLI surface
        run: |
          rea --help > rea-help.txt 2>&1 || true
          echo "----- help (first 120 lines) -----"
          head -120 rea-help.txt

      - name: Record the Android command surface (flags, not guesses)
        run: |
          : > android-commands.txt
          for cmd in inspect-android-package search-android-classes trace-android-references \
                     inspect-android-class inspect-android-method inspect-apk-signature \
                     decode-android-resources project-android-application-graph \
                     inspect-android-jni-bindings capture-adb-screen; do
            echo "===== rea $cmd --help =====" >> android-commands.txt
            rea "$cmd" --help >> android-commands.txt 2>&1 || echo "(help unavailable)" >> android-commands.txt
            echo >> android-commands.txt
          done
          wc -l android-commands.txt

      - name: Stage the target APK (verified, retried)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          APK: ${{ inputs.target_apk }}
        run: |
          mkdir -p targets
          for attempt in 1 2 3; do
            rm -f "targets/$APK"
            if gh release download "$TAG" --repo "${{ github.repository }}" \
                 --pattern "$APK" --dir targets --clobber \
               && python3 -c "import sys,zipfile; zipfile.ZipFile(sys.argv[1]).testzip() is None" "targets/$APK"; then
              echo "ok: $APK"
              break
            fi
            echo "attempt $attempt failed for $APK"
            sleep $((attempt * 5))
          done
          ls -l targets
          sha256sum targets/*.apk | tee targets.sha256

      # The Android provider needs a caller-supplied JADX bridge; REA pins one exact
      # artifact in src/android/JadxRelease.ts (0.7.1, sha256 6e5eacf5…ff75) and refuses
      # a look-alike project's JAR. Fetch it here and verify that digest before use.
      - name: Provide the pinned JADX bridge (digest verified)
        run: |
          jar="$RUNNER_TEMP/jadx-headless-mcp-0.7.1-all.jar"
          url="https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar"
          want="6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75"
          for i in 1 2 3; do
            curl -fsSL --retry 3 -o "$jar" "$url" && break || sleep 5
          done
          got=$(sha256sum "$jar" | cut -d' ' -f1)
          echo "jadx bridge sha256: $got"
          if [ "$got" != "$want" ]; then
            echo "REFUSING: digest does not match REA's pin"; exit 1
          fi
          echo "REA_JADX_MCP_JAR=$jar" >> "$GITHUB_ENV"
          java -version 2>&1 | head -1

      # Phase 2 evidence: declarations, signature and one reference trace. Every command
      # is recorded even when it fails, so a missing apktool/jadx on the runner shows up
      # as a named limitation instead of an empty file.
      - name: Collect package evidence (tolerant, recorded)
        run: |
          mkdir -p docs/audit/rea/evidence
          log=docs/audit/rea/evidence/run.txt
          : > "$log"
          apk="targets/${{ inputs.target_apk }}"
          collect() {
            label="$1"; shift
            echo "===== $label" >> "$log"
            if "$@" >> "$log" 2>&1; then echo "status: ok" >> "$log"; else echo "status: FAILED" >> "$log"; fi
            echo >> "$log"
          }
          collect "package (complete json)" rea inspect-android-package "$apk" --format json
          collect "signature" rea inspect-apk-signature "$apk" --format json
          collect "class inventory (all)" rea search-android-classes "$apk" "" --format json
          for cls in cn.nubia.gameassist.GameAssistHandle cn.nubia.gameassist.MultiSubScreenSinkActivity; do
            collect "references: $cls" rea trace-android-references "$apk" "$cls" --format json
          done
          tail -40 "$log"

      - uses: actions/upload-artifact@v4
        with:
          name: rea-cli-surface
          path: |
            rea-help.txt
            rea-version.txt
            android-commands.txt
            targets.sha256
            docs/audit/rea/evidence

      # The Actions results service is unreachable from the owner's side, so the CLI
      # surface is committed: Phase 2 needs the real command names, not a guess.
      - name: Commit the CLI surface
        run: |
          mkdir -p docs/audit/rea
          cp rea-help.txt rea-version.txt android-commands.txt docs/audit/rea/ 2>/dev/null || true
          git config user.name 'rea-analysis'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/audit/rea || true
          git diff --cached --quiet && echo "no drift" && exit 0
          git commit -m "docs(rea): record the installed CLI surface (node 24)"
          git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" || true
          git push
