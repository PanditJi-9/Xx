name: RedLab port (extract + triage the originals)

# Implements docs/MASTER_PLAN.md §3: the original APK is the material, not the reference.
# apktool brings resources/manifest/assets, jadx brings sources, then port_triage.py splits every
# unit into PORT_AS_IS / ADAPT / REIMPLEMENT. Nothing here rewrites code; it only reports what the
# port needs, which is what the ledger gates on.

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'APK asset names, space separated'
        required: true
        default: 'GameSpace.apk GameAssist.apk'
      tag:
        description: 'Release tag holding the APKs'
        required: true
        default: 're-targets'

permissions:
  contents: write  # draft releases and their assets are invisible to a read-only token

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch the APKs (draft-safe, verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/apps
          # A draft release has no /releases/tags/<tag> lookup, so the list endpoint is used and
          # the tag is matched client-side. This is the same measured fix the audit workflow
          # carries: without it the step "succeeded" with an empty directory.
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "${{ inputs.tag }}") | .assets[] | "\(.id) \(.name) \(.size)"' \
            > /tmp/assets.txt
          echo "assets listed: $(wc -l < /tmp/assets.txt)"
          for name in ${{ inputs.apps }}; do
            read -r id size < <(awk -v n="$name" '$2==n {print $1, $3}' /tmp/assets.txt)
            if [ -z "${id:-}" ]; then echo "missing asset: $name"; exit 1; fi
            for attempt in 1 2 3 4 5; do
              curl -sSL -C - -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/octet-stream" \
                "https://api.github.com/repos/${{ github.repository }}/releases/assets/$id" \
                -o "work/apps/$name" || true
              if [ "$(stat -c%s "work/apps/$name" 2>/dev/null || echo 0)" = "$size" ] && \
                 python3 -c "import sys,zipfile; zipfile.ZipFile(sys.argv[1]).testzip() is None" "work/apps/$name" 2>/dev/null; then
                echo "ok: $name $size"; break
              fi
              echo "retry $name: $(stat -c%s "work/apps/$name" 2>/dev/null || echo 0)/$size"
              sleep $((attempt * 5))
            done
          done
          ls -l work/apps

      - name: Install apktool and jadx
        run: |
          set -e
          curl -sSL -o /usr/local/bin/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          printf '#!/bin/sh\nexec java -jar /usr/local/bin/apktool.jar "$@"\n' > /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool
          curl -sSL -o /tmp/jadx.zip \
            https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q /tmp/jadx.zip -d /opt/jadx
          chmod +x /opt/jadx/bin/jadx
          /opt/jadx/bin/jadx --version

      - name: Extract resources and sources
        run: |
          set -e
          mkdir -p docs/port
          for apk in work/apps/*.apk; do
            app=$(basename "$apk" .apk)
            echo "== $app"
            # -s: skip dex decoding here; jadx produces the sources in the next step.
            apktool d -f -s "$apk" -o "work/port/$app/res-out" > "work/port-$app-apktool.log" 2>&1 || \
              { echo "apktool failed for $app"; tail -30 "work/port-$app-apktool.log"; exit 1; }
            # A 15k-class APK needs a bigger heap than the JVM default: the first run died
            # silently here, which is why the log is kept and printed on failure.
            JAVA_OPTS="-Xmx6g -XX:MaxMetaspaceSize=1g" /opt/jadx/bin/jadx \
              -d "work/port/$app/sources" --no-res --threads-count 2 \
              "$apk" > "work/port-$app-jadx.log" 2>&1 || true
            # jadx returns 1 when a handful of methods fail to decompile, while still writing the
            # tree. "Finished with errors, count: 4" is not a failed extraction; an empty tree is.
            count=$(find "work/port/$app/sources" -name '*.java' 2>/dev/null | wc -l)
            echo "$app: $count source files"
            if [ "$count" -lt 100 ]; then echo "jadx produced nothing usable for $app"; tail -20 "work/port-$app-jadx.log"; exit 1; fi
            # The decoded manifest is text, so the package is read from it rather than guessed
            # from the binary XML (which produced an empty string and silently disabled the
            # vendor-dependency rule).
            pkg=$(grep -oP 'package="\K[^"]+' "work/port/$app/res-out/AndroidManifest.xml" | head -1)
            echo "package guess: $pkg"
            python3 tools/port_triage.py \
              --sources "work/port/$app/sources" \
              --res "work/port/$app/res-out/res" \
              --app "$app" --package "$pkg" \
              --out "docs/port/${app}_TRIAGE.md" \
              --json "docs/port/${app}.json"
          done

      - name: Keep the measured triage in the build
        uses: actions/upload-artifact@v4
        with:
          name: port-triage
          path: |
            docs/port/*.md
            docs/port/*.json
          if-no-files-found: error

      - name: Stage the materials into their app modules
        run: |
          set -e
          # apktool writes into work/port/<app>/res-out, so that is the directory holding res/,
          # assets/ and the decoded manifest — the app folder above it also holds jadx sources.
          for extract in work/port/*/res-out/; do
            app=$(basename "$(dirname "$extract")")
            module="redlab/apps/$(echo "$app" | tr '[:upper:]' '[:lower:]')"
            if [ ! -d "$module" ]; then echo "no module for $app yet — staged materials skipped"; continue; fi
            python3 tools/port_materials.py --extract "$extract" --module "$module" \
              --app "$app" --triage "docs/port/${app}.json" --assert
          done

      - name: Does aapt2 accept the original resource corpus?
        run: |
          # The same aapt2 that will reject them in the build, run alone first so a refusal names
          # the file and line instead of arriving as one wall of Gradle output.
          python3 tools/resource_compile.py --include work/port/GameSpace/res-out/res --json \
            > /tmp/res-assay.json || true
          python3 - <<'PY'
          import json
          report = json.load(open('/tmp/res-assay.json'))
          if not report.get('verified'):
              print('resources: NOT VERIFIED (no usable aapt2)')
          else:
              print(f"resources: {len(report['offenders'])} refusals in {report['dirs']} res dirs")
              for item in report['offenders'][:20]:
                  print('  -', item)
          PY

      - name: Android SDK (licenses + platform 36 + build-tools 36)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build GameSpace out of the original materials
        working-directory: redlab
        run: ./gradlew :apps:gamespace:assembleDebug --no-daemon --stacktrace

      - name: Keep the APK this run produced
        uses: actions/upload-artifact@v4
        with:
          name: gamespace-debug-apk
          path: |
            redlab/apps/gamespace/build/outputs/apk/debug/*.apk
            redlab/apps/gamespace/MATERIALS.md
          if-no-files-found: error

      - name: Show the summary
        run: |
          for f in docs/port/*_TRIAGE.md; do
            echo "== $f"
            sed -n '1,14p' "$f"
          done
